spring.application.name=banco-kwanza
server.address=127.0.0.1
server.port=8081
spring.datasource.url=jdbc:postgresql://127.0.0.1:${INTERBANK_DB_PORT:5433}/banco_kwanza
spring.datasource.username=interbank_kwanza
spring.datasource.password=${KWANZA_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
interbank.shared-password=${INTERBANK_SHARED_PASSWORD}
interbank.jwt.secret=${KWANZA_JWT_SECRET}
interbank.recovery-delay-ms=${INTERBANK_RECOVERY_DELAY_MS:15000}
interbank.horizonte.base-url=${HORIZONTE_BASE_URL:http://127.0.0.1:8082}
